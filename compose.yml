services:
  db:
    image: postgres:16-alpine
    container_name: upvote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upvote}
      POSTGRES_USER: ${POSTGRES_USER:-upvote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upvote_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./.data/postgres}:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: upvote-backend:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: upvote-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_CONTAINER_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://upvote:upvote_password@db:5432/upvote}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_CONTAINER_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: upvote-frontend:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    container_name: upvote-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
